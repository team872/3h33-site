server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Derrière Traefik : garder les redirections relatives, sinon nginx
    # les réécrit en http:// et le navigateur fait un aller-retour inutile.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # L'adresse de test n'est jamais indexée. 3h33.com l'est.
    set $robots "";
    if ($host = nouveau.3h33.com) { set $robots "noindex, nofollow"; }
    add_header X-Robots-Tag $robots always;

    # Redirections des anciennes adresses WordPress
    include /etc/nginx/redirections.conf;

    location = /sitemap.xml { add_header Content-Type application/xml; }

    # Ce que l'ancien hébergement mutualisé continue de servir, par procuration :
    #   - les decks de masterclass et l'atelier, déposés par FTP par le robot du
    #     dépôt masterclass-3h33 (atelier, cockpit-ia, ia-talent, salle…) ;
    #   - leur relais PHP (relais/ia.php, mur.php, inscription.php), qui garde
    #     les clés côté serveur et lit X-Forwarded-For pour ses limites ;
    #   - les médias WordPress encore liés depuis l'extérieur (wp-content/uploads).
    # On joint le serveur mutualisé par son adresse, avec le nom 3h33.com en
    # en-tête et en SNI : il répond pour ce nom quel que soit le DNS.
    location ~ ^/(atelier|cockpit-ia|ia-talent|ia-cabinet-dentaire|exemple-audencia|pays-de-fontainebleau|lenotre|salle|relais)(/|$) {
        proxy_pass https://147.79.116.46;
        proxy_ssl_server_name on;
        proxy_ssl_name 3h33.com;
        proxy_set_header Host 3h33.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }
    # Les médias WordPress : « ^~ » pour passer devant le 404 général de /wp-content.
    location ^~ /wp-content/uploads/ {
        expires 30d;
        try_files $uri @ancien;
    }
    # /medias/ est partagé : nos images d'abord, sinon celles des decks.
    location ^~ /medias/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @ancien;
    }
    location @ancien {
        proxy_pass https://147.79.116.46;
        proxy_ssl_server_name on;
        proxy_ssl_name 3h33.com;
        proxy_set_header Host 3h33.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|gif|ico|woff2?|mp4|webm|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
