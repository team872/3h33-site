# Les pages HTML partaient sans Cache-Control : le navigateur fixait seul leur durée
# de vie, et gardait l'ancienne page d'accueil après la refonte du 04/10/2026.
# « no-cache » ne veut pas dire « pas de cache » : le navigateur revalide (ETag) à
# chaque visite, et reçoit un 304 sans corps tant que la page n'a pas changé.
map $sent_http_content_type $cache_html {
    ~*text/html "no-cache";
    default     "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Derrière Traefik : garder les redirections relatives, sinon nginx
    # les réécrit en http:// et le navigateur fait un aller-retour inutile.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_html always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # L'adresse de test n'est jamais indexée. 3h33.com l'est.
    set $robots "";
    if ($host = nouveau.3h33.com) { set $robots "noindex, nofollow"; }
    add_header X-Robots-Tag $robots always;

    # Redirections des anciennes adresses WordPress
    include /etc/nginx/redirections.conf;

    location = /sitemap.xml { add_header Content-Type application/xml; }

    # Ce que l'ancien hébergement mutualisé continue de servir, par procuration :
    #   - les decks de masterclass et l'atelier, déposés par FTP par le robot du
    #     dépôt masterclass-3h33 (atelier, cockpit-ia, ia-talent, salle…) ;
    #   - leur relais PHP (relais/ia.php, mur.php, inscription.php), qui garde
    #     les clés côté serveur et lit X-Forwarded-For pour ses limites ;
    #   - les médias WordPress encore liés depuis l'extérieur (wp-content/uploads) ;
    #   - /img/, où les decks vont chercher leurs images en adresse absolue
    #     (https://3h33.com/img/…) : sans elle, tous les decks perdent leurs visuels ;
    #   - /galaxie/, que le dépôt 3h33-galaxie publie par FTP. Une copie locale en
    #     avait été faite ici, et elle accusait quatre sites de retard le 03/10.
    # La liste des decks fait foi dans masterclass-3h33/publier.json : herport et
    # afnor y sont entrés après le 18/09 sans être ajoutés ici, et auraient répondu
    # 404 à la bascule. Le contrôle de fin de publication du robot (il interroge
    # https://3h33.com/<dossier>/) signalera le prochain oubli.
    # On joint le serveur mutualisé par son adresse, avec le nom 3h33.com en
    # en-tête et en SNI : il répond pour ce nom quel que soit le DNS.
    location ~ ^/(atelier|cockpit-ia|ia-talent|ia-cabinet-dentaire|exemple-audencia|pays-de-fontainebleau|lenotre|herport|afnor|salle|relais|img|galaxie)(/|$) {
        proxy_pass https://147.79.116.46;
        proxy_ssl_server_name on;
        proxy_ssl_name 3h33.com;
        proxy_set_header Host 3h33.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 90s;
    }
    # Les médias WordPress : « ^~ » pour passer devant le 404 général de /wp-content.
    location ^~ /wp-content/uploads/ {
        expires 30d;
        try_files $uri @ancien;
    }
    # /medias/ est partagé : nos images d'abord, sinon celles des decks.
    location ^~ /medias/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @ancien;
    }
    location @ancien {
        proxy_pass https://147.79.116.46;
        proxy_ssl_server_name on;
        proxy_ssl_name 3h33.com;
        proxy_set_header Host 3h33.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|gif|ico|woff2?|mp4|webm|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}

# old.3h33.com — l'ancien WordPress, gardé consultable après la bascule (03/10/2026),
# le temps de vérifier qu'aucune page n'a été oubliée et d'ouvrir son administration.
# On ne crée pas ce nom chez Hostinger : WordPress y renverrait aussitôt vers son
# adresse officielle, 3h33.com, c'est-à-dire vers le NOUVEAU site. On lui parle donc
# sous le nom 3h33.com, et on réécrit au retour les liens, redirections et cookies.
# Jamais indexé : en-tête noindex sur toutes les réponses, et robots.txt fermé.
server {
    listen 80;
    server_name old.3h33.com;
    absolute_redirect off;
    client_max_body_size 64m;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass https://147.79.116.46;
        proxy_ssl_server_name on;
        proxy_ssl_name 3h33.com;
        proxy_set_header Host 3h33.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # sub_filter ne sait pas réécrire une réponse compressée.
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;

        proxy_redirect https://3h33.com/ https://old.3h33.com/;
        proxy_redirect http://3h33.com/ https://old.3h33.com/;
        proxy_redirect https://www.3h33.com/ https://old.3h33.com/;
        proxy_cookie_domain 3h33.com old.3h33.com;
        proxy_cookie_domain .3h33.com old.3h33.com;

        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json application/xml text/xml;
        sub_filter 'https://3h33.com' 'https://old.3h33.com';
        sub_filter 'http://3h33.com' 'https://old.3h33.com';
        sub_filter 'https://www.3h33.com' 'https://old.3h33.com';
        sub_filter 'https:\/\/3h33.com' 'https:\/\/old.3h33.com';
        # Adresses sans protocole (le slider de l'accueil) : sans elles, ses scripts
        # partiraient chercher /wp-content/plugins/ sur le nouveau site.
        sub_filter "'//3h33.com/" "'//old.3h33.com/";
        sub_filter '"//3h33.com/' '"//old.3h33.com/';
    }
}
