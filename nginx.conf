server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Derrière Traefik : garder les redirections relatives, sinon nginx
    # les réécrit en http:// et le navigateur fait un aller-retour inutile.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # L'adresse de test n'est jamais indexée. 3h33.com l'est.
    set $robots "";
    if ($host = nouveau.3h33.com) { set $robots "noindex, nofollow"; }
    add_header X-Robots-Tag $robots always;

    # Redirections des anciennes adresses WordPress
    include /etc/nginx/redirections.conf;

    location = /sitemap.xml { add_header Content-Type application/xml; }

    location ~* \.(jpg|jpeg|png|webp|svg|gif|ico|woff2?|mp4|webm|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
