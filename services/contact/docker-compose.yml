# Formulaire de contact de 3h33.com.
# L'adresse de destination n'est jamais dans les pages : elle est ici, en .env.
services:
  contact:
    build: .
    container_name: h3h33_contact
    restart: unless-stopped
    env_file: .env
    volumes:
      - messages:/données/messages
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.h3h33contact.rule=Host(`nouveau.3h33.com`) && PathPrefix(`/api/contact`)"
      - "traefik.http.routers.h3h33contact.entrypoints=websecure"
      - "traefik.http.routers.h3h33contact.tls=true"
      - "traefik.http.routers.h3h33contact.tls.certresolver=letsencrypt"
      - "traefik.http.routers.h3h33contact.priority=100"
      - "traefik.http.services.h3h33contact.loadbalancer.server.port=3020"
      # ---- Vitrine d'ATELIER LMA (26/09/2026) : son formulaire de demande de
      # demonstration passe par ce meme service, vers la meme adresse cachee.
      # Ajouter https://lma.botmoileqi.com a ORIGINES dans le .env du VPS.
      # ---- Site principal BotMoiLeQi (29/09/2026) : botmoileqi.com est servi par
      # un AUTRE VPS (217.65.146.187) ; son formulaire poste en direct (CORS) vers
      # https://lma.botmoileqi.com/api/contact. Pour cela ORIGINES contient aussi
      # https://botmoileqi.com et https://www.botmoileqi.com (ancien .env garde
      # en .env.avant-botmoileqi). Sujet des messages : « Demonstration BotMoiLeQi ».
      - "traefik.http.routers.h3h33contact-lma.rule=Host(`lma.botmoileqi.com`) && PathPrefix(`/api/contact`)"
      - "traefik.http.routers.h3h33contact-lma.entrypoints=websecure"
      - "traefik.http.routers.h3h33contact-lma.tls=true"
      - "traefik.http.routers.h3h33contact-lma.tls.certresolver=letsencrypt"
      - "traefik.http.routers.h3h33contact-lma.priority=100"
      - "traefik.http.routers.h3h33contact-lma.service=h3h33contact"
      # ---- Bascule de 3h33.com : à décommenter le jour où le DNS pointe ici.
      # - "traefik.http.routers.h3h33contact-prod.rule=Host(`3h33.com`) && PathPrefix(`/api/contact`)"
      # - "traefik.http.routers.h3h33contact-prod.entrypoints=websecure"
      # - "traefik.http.routers.h3h33contact-prod.tls=true"
      # - "traefik.http.routers.h3h33contact-prod.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.h3h33contact-prod.priority=100"
      # - "traefik.http.routers.h3h33contact-prod.service=h3h33contact"
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:3020/sante >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  messages:
