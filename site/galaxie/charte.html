  /* ---------- Tokens (synced with hub) ---------- */
  :root{
    --bg:#f6f5f1;
    --bg-2:#efece4;
    --ink:#0b0b10;
    --ink-2:#2a2a32;
    --muted:#6b6b78;
    --line:#e3dfd4;
    --line-2:#d6d1c3;
    --card:#ffffff;
    --accent:#5b3df5;
    --accent-ink:#3a25c4;
    --accent-soft:#ece7ff;
    --chip:#f1ede2;
    --shadow: 0 1px 0 rgba(11,11,16,.04), 0 8px 24px -12px rgba(11,11,16,.10);
    --radius: 14px;
    --radius-sm: 10px;
    --maxw: 1240px;
  }
  html[data-theme="dark"]{
    --bg:#0c0c11;
    --bg-2:#121218;
    --ink:#f7f5ef;
    --ink-2:#e6e3da;
    --muted:#b3b1bd;
    --line:#2a2a36;
    --line-2:#363644;
    --card:#1a1a23;
    --accent:#b9a8ff;
    --accent-ink:#e0d6ff;
    --accent-soft:#221f3d;
    --chip:#23232f;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{
    background:var(--bg);color:var(--ink);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  body{min-height:100vh}
  a{color:inherit}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::selection{background:var(--accent);color:#fff}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
  @media (max-width:560px){ .wrap{padding:0 16px} }

  /* ---------- Topbar ---------- */
  .topbar{
    position:relative;border-bottom:1px solid var(--line);
    background:

      var(--bg);
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 0}
  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--muted);font-size:13.5px;text-decoration:none;
    padding:6px 10px;border-radius:8px;
    transition:color .15s,background .15s;
  }
  .back-link:hover{color:var(--ink);background:var(--chip)}
  .theme-btn{
    width:36px;height:36px;border-radius:10px;
    border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;color:var(--ink-2);
    transition:border-color .15s,color .15s;
  }
  .theme-btn:hover{border-color:var(--accent);color:var(--accent)}
  .theme-btn .icn-moon{display:none}
  html[data-theme="dark"] .theme-btn .icn-sun{display:none}
  html[data-theme="dark"] .theme-btn .icn-moon{display:block}

  .hero{padding:56px 0 36px}
  h1.title{
    font-family: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    font-weight:500;font-size:clamp(34px,4.6vw,52px);
    letter-spacing:-.02em;line-height:1.05;margin:0;
  }
  h1.title em{font-style:italic;color:var(--accent)}
  .lede{color:var(--ink-2);font-size:17px;max-width:62ch;margin:14px 0 0}

  /* ---------- Layout : sidebar + main ---------- */
  .layout{
    display:grid;grid-template-columns: 220px 1fr;gap:48px;
    padding:32px 0 80px;align-items:start;
  }
  @media (max-width:900px){ .layout{grid-template-columns:1fr;gap:24px} }

  .sidenav{
    position:sticky;top:24px;
    border-left:2px solid var(--line);
    padding:4px 0 4px 16px;
  }
  .sidenav-group{margin-bottom:18px}
  .sidenav-group > strong{
    display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin-bottom:8px;
  }
  .sidenav a{
    display:block;text-decoration:none;color:var(--ink-2);
    padding:6px 8px;border-radius:6px;font-size:14px;
    transition:background .15s,color .15s;
  }
  .sidenav a:hover{background:var(--chip);color:var(--ink)}
  .sidenav a.active{color:var(--accent);font-weight:600}
  @media (max-width:900px){
    .sidenav{position:static;border-left:0;border-top:1px solid var(--line);
             padding:16px 0 0;display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
  }

  /* ---------- Sections ---------- */
  section.block{
    scroll-margin-top:24px;
    margin-bottom:64px;
  }
  section.block > header{
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:24px;
  }
  section.block > header h2{
    font-family: ui-serif, "New York", Georgia, serif;
    font-weight:500;font-size:28px;letter-spacing:-.01em;margin:0;
  }
  section.block > header .meta{color:var(--muted);font-size:13px}
  section.block > header .meta a{color:var(--accent);text-decoration:none}
  section.block > header .meta a:hover{text-decoration:underline}

  /* ---------- Brand sub-blocks ---------- */
  .brand-summary{color:var(--ink-2);max-width:70ch;margin:0 0 24px;font-size:15.5px}
  .grid{display:grid;gap:14px}
  .grid.cols-2{grid-template-columns:repeat(2,1fr)}
  .grid.cols-3{grid-template-columns:repeat(3,1fr)}
  @media (max-width:720px){ .grid.cols-2,.grid.cols-3{grid-template-columns:1fr} }

  .panel{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;
    box-shadow:var(--shadow);
  }
  .panel h3{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 12px;font-weight:600;
  }

  /* ---------- Logo previews ---------- */
  .logo-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media (max-width:720px){ .logo-strip{grid-template-columns:1fr} }
  .logo-tile{
    aspect-ratio: 4/3;border-radius:10px;
    display:grid;place-items:center;padding:18px;
    border:1px solid var(--line);position:relative;overflow:hidden;
  }
  .logo-tile.bg-light{background:#fff;color:#0b0b10}
  .logo-tile.bg-dark{background:#0b0b10;color:#fff}
  .logo-tile.bg-accent{background:var(--accent);color:#fff}
  .logo-tile img{max-width:100%;max-height:100%;object-fit:contain}
  .logo-tile .placeholder{
    width:100%;height:100%;display:grid;place-items:center;
    border:1.5px dashed currentColor;border-radius:8px;opacity:.5;
    font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  }
  .logo-tile .bg-label{
    position:absolute;bottom:6px;left:8px;
    font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    opacity:.55;
  }
  .logo-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:8px;font-size:12.5px;
    background:var(--chip);color:var(--ink-2);
    border:1px solid transparent;
    transition:all .15s;text-decoration:none;
  }
  .btn:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn.primary:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.ok{color:#1f7a3a;background:#e6f5ec;border-color:#bfe5cd}
  html[data-theme="dark"] .btn.ok{color:#7be0a0;background:#10271a;border-color:#1e4530}

  /* ---------- Color swatches ---------- */
  .swatch{
    border-radius:10px;border:1px solid var(--line);
    overflow:hidden;cursor:pointer;
    transition:transform .15s,box-shadow .2s;
  }
  .swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .swatch-color{height:80px}
  .swatch-meta{padding:10px 12px;background:var(--card)}
  .swatch-name{font-size:13px;font-weight:600}
  .swatch-hex{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              font-size:12px;color:var(--muted);margin-top:2px}

  /* ---------- Type sample ---------- */
  .type-sample{padding:16px 0}
  .type-name{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .type-display{font-size:32px;line-height:1.1;margin:6px 0 4px;letter-spacing:-.01em}
  .type-meta{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---------- Text snippets (copy on click) ---------- */
  .snippet{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:10px 14px;
    margin-bottom:6px;position:relative;
  }
  .snippet-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  }
  .snippet-body{
    font-size:14px;line-height:1.5;color:var(--ink-2);
    white-space:pre-wrap;
  }
  .snippet-copy{
    background:transparent;border:1px solid var(--line);
    padding:3px 9px;border-radius:6px;font-size:11px;
    color:var(--muted);cursor:pointer;transition:all .15s;
  }
  .snippet-copy:hover{color:var(--accent);border-color:var(--accent)}
  .snippet-copy.ok{color:#1f7a3a;border-color:#bfe5cd;background:#e6f5ec}
  .snippet-category{
    font-size:11px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--ink);font-weight:600;
    margin:18px 0 8px;padding-bottom:4px;
    border-bottom:1px solid var(--line);
  }
  .snippet-category:first-child{margin-top:0}

  /* ---------- Video ---------- */
  .video-frame{
    aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;
    background:var(--bg-2);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--muted);font-size:13px;
  }
  .video-frame iframe,.video-frame video{width:100%;height:100%;border:0}

  /* ---------- Screenshots ---------- */
  .screenshot{
    aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;
    background:var(--bg-2);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--muted);font-size:13px;
  }
  .screenshot img{width:100%;height:100%;object-fit:cover}

  /* ---------- Add-asset hint ---------- */
  .hint{
    background:var(--accent-soft);color:var(--accent-ink);
    border:1px solid color-mix(in oklab, var(--accent) 30%, transparent);
    border-radius:var(--radius-sm);padding:14px 18px;font-size:13.5px;
    margin-top:32px;
  }
  .hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
             background:rgba(0,0,0,.05);padding:1px 6px;border-radius:4px}
  html[data-theme="dark"] .hint code{background:rgba(255,255,255,.08)}

  /* ---------- Empty placeholders ---------- */
  .placeholder-block{
    border:1.5px dashed var(--line-2);border-radius:var(--radius-sm);
    padding:18px;color:var(--muted);font-size:13.5px;
    background:var(--bg-2);
  }

  /* ---------- Brand color marker ---------- */
  .brand-marker{
    display:inline-block;width:10px;height:10px;border-radius:3px;
    margin-right:8px;vertical-align:middle;
    background:var(--brand-color, var(--accent));
  }
</style>
</head>

/* ============================================================
   Render
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const escapeHTML = (s) => String(s||"").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

/* ---- Sidebar ---- */
function renderSidebar(){
  const groups = {};
  for(const b of BRANDS){ (groups[b.group] = groups[b.group] || []).push(b); }
  const html = [
    `<div class="sidenav-group">
       <strong>Communication</strong>
       <a href="#textes-com" data-target="textes-com">Textes prêts à l'emploi</a>
     </div>`,
    ...Object.entries(groups).map(([g, list]) => `
       <div class="sidenav-group">
         <strong>${escapeHTML(g)}</strong>
         ${list.map(b => `
           <a href="#${b.id}" data-target="${b.id}">
             <span class="brand-marker" style="--brand-color:${b.color}"></span>${escapeHTML(b.name)}
           </a>`).join("")}
       </div>`)
  ].join("");
  $("#sidenav").innerHTML = html;
}

/* ---- Logo block ---- */
function renderLogos(b){
  const tiles = (b.logos && b.logos.length)
    ? b.logos.map(l => `
        <div class="logo-tile bg-${l.bg||"light"}">
          <img src="${escapeHTML(l.src)}" alt="Logo ${escapeHTML(b.name)}" />
          <span class="bg-label">${escapeHTML(l.label||l.bg||"")}</span>
        </div>`).join("")
    : ["light","dark","accent"].map(bg => `
        <div class="logo-tile bg-${bg}">
          <div class="placeholder">à déposer</div>
          <span class="bg-label">${bg === "light" ? "Sur clair" : bg === "dark" ? "Sur sombre" : "Sur accent"}</span>
        </div>`).join("");

  const actions = (b.logos && b.logos.length)
    ? b.logos.map(l => `<a class="btn" href="${escapeHTML(l.src)}" download>↓ ${escapeHTML((l.src.split("/").pop()||"").split(".").pop().toUpperCase())}</a>`).join("")
    : `<span class="btn" style="cursor:default;opacity:.6">Dépose des fichiers dans <code style="margin-left:4px">assets/logos/${b.id}/</code></span>`;

  return `
    <div class="panel">
      <h3>Logos</h3>
      <div class="logo-strip">${tiles}</div>
      <div class="logo-actions">${actions}</div>
    </div>`;
}

/* ---- Palette block ---- */
function renderPalette(b){
  if(!b.palette || !b.palette.length){
    return `<div class="panel"><h3>Couleurs</h3>
      <div class="placeholder-block">Ajoute une palette dans <code>BRANDS["${b.id}"].palette</code> — clic sur un swatch copiera le hex.</div>
    </div>`;
  }
  const cells = b.palette.map(c => `
    <button class="swatch copyable" data-copy="${escapeHTML(c.hex)}" title="Cliquer pour copier ${c.hex}">
      <div class="swatch-color" style="background:${c.hex}"></div>
      <div class="swatch-meta">
        <div class="swatch-name">${escapeHTML(c.name)}</div>
        <div class="swatch-hex">${escapeHTML(c.hex)}</div>
      </div>
    </button>`).join("");
  return `<div class="panel"><h3>Couleurs</h3><div class="grid cols-3" style="gap:10px">${cells}</div></div>`;
}

/* ---- Typo block ---- */
function renderType(b){
  if(!b.type || !b.type.length){
    return `<div class="panel"><h3>Typographies</h3>
      <div class="placeholder-block">Ajoute des typos dans <code>BRANDS["${b.id}"].type</code>.</div>
    </div>`;
  }
  const rows = b.type.map(t => `
    <div class="type-sample">
      <div class="type-name">${escapeHTML(t.role)}</div>
      <div class="type-display" style="font-family:${t.family}">${escapeHTML(b.name)}</div>
      <div class="type-meta">${escapeHTML(t.family)} · ${escapeHTML(t.weight||"")}${t.note?" · "+escapeHTML(t.note):""}</div>
    </div>`).join("");
  return `<div class="panel"><h3>Typographies</h3>${rows}</div>`;
}

/* ---- Texts block ---- */
function renderTexts(b){
  const items = [
    b.tagline    && { label: "Tagline",          text: b.tagline },
    b.pitch      && { label: "Pitch (1 phrase)", text: b.pitch },
    b.description&& { label: "Description longue", text: b.description }
  ].filter(Boolean);
  if(!items.length){
    return `<div class="panel"><h3>Textes</h3>
      <div class="placeholder-block">Renseigne <code>tagline</code>, <code>pitch</code> et <code>description</code> dans <code>BRANDS["${b.id}"]</code>.</div>
    </div>`;
  }
  const rows = items.map(it => `
    <div class="snippet">
      <div class="snippet-label">
        <span>${escapeHTML(it.label)}</span>
        <button class="snippet-copy" data-copy="${escapeHTML(it.text)}">Copier</button>
      </div>
      <div class="snippet-body">${escapeHTML(it.text)}</div>
    </div>`).join("");
  return `<div class="panel"><h3>Textes</h3>${rows}</div>`;
}

  let inner;
  if(b.video?.youtube){
    inner = `<iframe src="https://www.youtube.com/embed/${escapeHTML(b.video.youtube)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  } else if(b.video?.src){
    inner = `<video src="${escapeHTML(b.video.src)}" controls playsinline></video>`;
  } else {
    inner = `Dépose une vidéo dans <code style="margin-left:4px">assets/videos/${b.id}.mp4</code><br>ou ajoute <code style="margin-left:4px">{ youtube: "ID" }</code>`;

  return `<div class="panel"><h3>Vidéo de démo</h3><div class="video-frame">${inner}</div></div>`;

/* ---- Copy-on-click ---- */
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly","");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error("execCommand failed"));
    }catch(err){ reject(err); }
  });
}

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-copy]");
  if(!btn) return;
  e.preventDefault();
  try{
    await copyText(btn.dataset.copy);
    const original = btn.textContent;
    btn.classList.add("ok");
    if(btn.classList.contains("snippet-copy")){
      btn.textContent = "✓ Copié";
      setTimeout(() => { btn.classList.remove("ok"); btn.textContent = original; }, 1400);
    } else {
      btn.style.outline = "2px solid var(--accent)";
      setTimeout(() => { btn.style.outline = ""; }, 700);
    }
  }catch(err){
    console.warn("Copy failed:", err);
    if(btn.classList.contains("snippet-copy")){
      const original = btn.textContent;
      btn.textContent = "⚠ Échec";
      setTimeout(() => { btn.textContent = original; }, 1600);
    }
  }
});

/* ---- Theme toggle ---- */
const THEME_KEY = "galaxie-theme";
const applyTheme = (t) => document.documentElement.setAttribute("data-theme", t);
const stored = localStorage.getItem(THEME_KEY);
if(stored) applyTheme(stored);
else if(window.matchMedia("(prefers-color-scheme: dark)").matches) applyTheme("dark");
$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next); localStorage.setItem(THEME_KEY, next);
});

/* ---- Sidebar active link on scroll ---- */
const links = [...document.querySelectorAll(".sidenav a")];
const targets = links.map(a => document.getElementById(a.dataset.target)).filter(Boolean);
const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      links.forEach(a => a.classList.toggle("active", a.dataset.target === entry.target.id));
    }
  });
}, { rootMargin: "-30% 0px -65% 0px" });
targets.forEach(t => io.observe(t));

/* ---- Smooth scroll for anchor links ---- */
links.forEach(a => a.addEventListener("click", (e) => {
  const tgt = document.getElementById(a.dataset.target);
  if(tgt){
    e.preventDefault();
    window.scrollTo({ top: tgt.offsetTop - 16, behavior: "smooth" });
    history.replaceState(null, "", "#" + a.dataset.target);
  }
}));
