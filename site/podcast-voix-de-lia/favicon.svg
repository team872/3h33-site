<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0c"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#c4a265" stroke-width="1.5"/>
  
  <!-- Vintage microphone head (capsule) - rounded rectangle -->
  <rect x="22" y="8" width="20" height="28" rx="10" ry="10" fill="none" stroke="#c4a265" stroke-width="2.5"/>
  
  <!-- Grille lines on mic head -->
  <line x1="22" y1="16" x2="42" y2="16" stroke="#c4a265" stroke-width="1" opacity="0.5"/>
  <line x1="22" y1="21" x2="42" y2="21" stroke="#c4a265" stroke-width="1" opacity="0.5"/>
  <line x1="22" y1="26" x2="42" y2="26" stroke="#c4a265" stroke-width="1" opacity="0.5"/>
  <line x1="23" y1="31" x2="41" y2="31" stroke="#c4a265" stroke-width="1" opacity="0.4"/>
  
  <!-- Mic body / stem -->
  <line x1="32" y1="36" x2="32" y2="48" stroke="#c4a265" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Mic stand arc -->
  <path d="M20,32 Q20,42 32,42 Q44,42 44,32" fill="none" stroke="#c4a265" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Base -->
  <line x1="25" y1="48" x2="39" y2="48" stroke="#c4a265" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Small audio wave accents -->
  <path d="M14,22 Q12,26 14,30" fill="none" stroke="#c4a265" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
  <path d="M50,22 Q52,26 50,30" fill="none" stroke="#c4a265" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
</svg>